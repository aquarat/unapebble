%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/maxim,max17262.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Maxim MAX17262 fuel gauge

maintainers:
  - aquarat <3090997+aquarat@users.noreply.github.com>

description:
  Single-cell fuel gauge with an internal current-sense resistor, running the
  ModelGauge m5 EZ algorithm. Its model comes from the battery it monitors, a
  simple-battery node, and from the empty and recovery voltages here.

properties:
  compatible:
    const: maxim,max17262

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1
    description: The ALRT pin, an open-drain alert output.

  monitored-battery:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: The battery being gauged, a simple-battery node.

  maxim,empty-microvolt:
    description: Voltage at which the battery counts as empty under load (VEmpty.VE).
    minimum: 2500000
    maximum: 4000000

  maxim,recovery-microvolt:
    description: Voltage above which the empty detection clears (VEmpty.VR).
    minimum: 2500000
    maximum: 5000000

required:
  - compatible
  - reg
  - monitored-battery
  - maxim,empty-microvolt
  - maxim,recovery-microvolt

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        fuel-gauge@36 {
            compatible = "maxim,max17262";
            reg = <0x36>;
            monitored-battery = <&battery>;
            maxim,empty-microvolt = <3400000>;
            maxim,recovery-microvolt = <3960000>;
        };
    };
