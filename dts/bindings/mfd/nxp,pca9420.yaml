%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/nxp,pca9420.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: NXP PCA9420 power management IC

maintainers:
  - aquarat <3090997+aquarat@users.noreply.github.com>

description:
  Linear battery charger, two buck converters and two LDOs, in four modes. The
  battery being charged is described by a simple-battery node, which gives the
  charge current, the termination current and the charge voltage.

properties:
  compatible:
    const: nxp,pca9420

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1
    description: INTB, an open-drain output, active low.

  monitored-battery:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: The battery being charged, a simple-battery node.

required:
  - compatible
  - reg
  - interrupts
  - monitored-battery

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        pmic@61 {
            compatible = "nxp,pca9420";
            reg = <0x61>;
            interrupts = <7 IRQ_TYPE_EDGE_BOTH>;
            monitored-battery = <&battery>;
        };
    };
