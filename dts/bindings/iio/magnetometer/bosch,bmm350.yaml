%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/magnetometer/bosch,bmm350.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Bosch BMM350 3-axis magnetometer

maintainers:
  - aquarat <3090997+aquarat@users.noreply.github.com>

properties:
  compatible:
    const: bosch,bmm350

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  vdd-supply: true

  vddio-supply: true

  mount-matrix:
    description: An optional 3x3 mounting rotation matrix.

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        magnetometer@14 {
            compatible = "bosch,bmm350";
            reg = <0x14>;
            interrupts = <2 IRQ_TYPE_EDGE_RISING>;
        };
    };
