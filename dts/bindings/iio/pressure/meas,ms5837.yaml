%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/pressure/meas,ms5837.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: TE Connectivity MS5837 pressure and temperature sensor

maintainers:
  - aquarat <3090997+aquarat@users.noreply.github.com>

description: |
  A trivial device upstream; this binding adds its supply, which a board may switch.

properties:
  compatible:
    const: meas,ms5837

  reg:
    maxItems: 1

  vdd-supply: true

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        pressure@76 {
            compatible = "meas,ms5837";
            reg = <0x76>;
        };
    };
