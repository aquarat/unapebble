%YAML 1.2
---
$id: http://devicetree.org/schemas/net/bluetooth/st,bluenrg-2.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ST BlueNRG-2 Bluetooth LE network processor on SPI

maintainers:
  - aquarat <3090997+aquarat@users.noreply.github.com>

description:
  A BlueNRG-2 running ST's DTM firmware, its SPI variant, used as an HCI
  controller. It frames H4 packets in its own SPI protocol (BlueNRG-2N data
  sheet DS13280, 6.5), with a header giving the room in its buffers, and
  raises IRQ when it is ready for a write or has data to read.

allOf:
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    const: st,bluenrg-2

  reg:
    maxItems: 1

  spi-max-frequency:
    maximum: 8000000

  spi-cpha: true

  irq-gpios:
    maxItems: 1
    description: IRQ, high when the chip is ready for a transfer or has data to read.

  reset-gpios:
    maxItems: 1
    description: RESETN.

required:
  - compatible
  - reg
  - spi-cpha
  - irq-gpios
  - reset-gpios

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        bluetooth@0 {
            compatible = "st,bluenrg-2";
            reg = <0>;
            spi-max-frequency = <1000000>;
            spi-cpha;
            irq-gpios = <&gpioa 9 GPIO_ACTIVE_HIGH>;
            reset-gpios = <&gpioa 8 (GPIO_ACTIVE_LOW | GPIO_OPEN_DRAIN)>;
        };
    };
