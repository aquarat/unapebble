%YAML 1.2
---
$id: http://devicetree.org/schemas/mtd/st,stm32u5-flash-controller.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: STMicroelectronics STM32U5 embedded flash controller

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  Controller that writes and erases the embedded flash, which the CPUs read
  and execute from at its own address. The flash is a child node.

properties:
  compatible:
    const: st,stm32u5-flash-controller

  reg:
    maxItems: 1

  "#address-cells":
    const: 1

  "#size-cells":
    const: 1

patternProperties:
  "^flash@[0-9a-f]+$":
    type: object
    $ref: /schemas/mtd/mtd.yaml#
    description: The embedded flash, at its CPU address.

    properties:
      reg:
        maxItems: 1

    required:
      - reg

    unevaluatedProperties: false

required:
  - compatible
  - reg
  - "#address-cells"
  - "#size-cells"

additionalProperties: false

examples:
  - |
    flash-controller@40022000 {
        compatible = "st,stm32u5-flash-controller";
        reg = <0x40022000 0x400>;
        #address-cells = <1>;
        #size-cells = <1>;

        flash@8000000 {
            reg = <0x08000000 0x400000>;

            partitions {
                compatible = "fixed-partitions";
                #address-cells = <1>;
                #size-cells = <1>;

                partition@0 {
                    label = "code";
                    reg = <0x0 0x100000>;
                };
            };
        };
    };
