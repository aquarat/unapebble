# SPDX-License-Identifier: Apache-2.0
#
# The GitHub counterpart of .forgejo/workflows/unawatch.yml: builds the UNA
# Watch firmware and the tether stub, and publishes them as GitHub Releases.
#
# GitHub is a push mirror of the Forgejo repository (git push --mirror), which
# deletes any ref made here, so releases only use tags that come from Forgejo:
# "unawatch-latest", which Forgejo's own release job moves to each main build,
# and v* tags. Pushes to main and pull requests only build; the rolling
# release is published when the mirror moves unawatch-latest, on the commit it
# points at (decision 261127-144548-02).

name: UNA Watch firmware

on:
  push:
    branches: [main]
    tags: ['v*', 'unawatch-latest']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unawatch-${{ github.ref }}
  # A newer commit supersedes a branch build; a release run is left to finish.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The image docker/setup.sh is written for, as on Forgejo.
    container:
      image: ubuntu:24.04
    env:
      BOARD: unawatch
      PEBBLEOS_SDK_ROOT: /opt/pebbleos-sdk-0.1.17
      VIRTUAL_ENV: /opt/venv
      CCACHE_MAXSIZE: 500M
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # actions/checkout needs git in the image for a real clone.
      - name: Install git
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git

      # Every commit and tag (the version comes from git describe), with file
      # contents fetched as needed.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Check out the submodules
        id: version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --depth 1 --jobs 8
          version=$(git describe --tags --match 'v[0-9]*' --always)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"

      # The SDK (220 MB from GitHub's own release storage) and the PyPI
      # packages download in seconds here, so they are not cached: the
      # Docker image and both CIs install them with this one script.
      - name: Install the build environment
        run: |
          docker/setup.sh apt sdk venv
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          echo "$PEBBLEOS_SDK_ROOT/arm-none-eabi/bin" >> "$GITHUB_PATH"

      # Pushes to main save the cache; other runs only read it.
      - name: Restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-unawatch-${{ github.sha }}
          restore-keys: ccache-unawatch-

      - name: Build
        run: |
          ccache --zero-stats
          pbl configure --board "$BOARD" -DCONFIG_RELEASE=y
          pbl build
          ccache --show-stats

      - name: Save the compiler cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-unawatch-${{ github.sha }}

      # The tethered stub, a USB debug monitor installed like any image
      # (docs/boards/unawatch/tether.md), its experiments, and the tests of its
      # host tools against its protocol code built for the host.
      - name: Build the tether stub
        run: |
          make -C tools/una/tether OUT="$PWD/build-tether" VERSION="$VERSION" all test

      - name: Package
        run: |
          mkdir -p out
          name="unapebble_${BOARD}_${VERSION}"
          # The code and the system resources after it, one file for the
          # bootloader, up to the end of the 4 MiB flash.
          python3 tools/una/pack_ota.py build/pebbleos_resources.bin --max-size 0x3a0000 \
            -v "$VERSION" -o "out/$name.ota"
          cp build/pebbleos.elf "out/$name.elf"
          cp build/pebbleos.hex "out/$name.hex"
          if [ -f build/log.dict.json ]; then
            cp build/log.dict.json "out/${name}_loghash_dict.json"
          fi
          # The stub, and what drives it: host tools, experiments and their sources
          t="unapebble_tether_${VERSION}"
          cp build-tether/tether.ota "out/$t.ota"
          cp build-tether/tether.elf "out/$t.elf"
          tar -czf "out/${t}_host.tar.gz" --transform "s,^,$t/," \
            -C tools/una/tether tether.py bridge.py experiments stub/tether_api.h stub/tether_proto.h \
            -C "$PWD/build-tether" experiments
          (cd out && sha256sum -- * > SHA256SUMS)
          ls -l out

      - name: Store
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unawatch-firmware
          path: out
          if-no-files-found: error
          retention-days: 14

  # Runs no code from the repository: it only uploads what the build stored.
  publish:
    needs: firmware
    if: >-
      github.ref_type == 'tag' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref_name == 'unawatch-latest' || startsWith(github.ref_name, 'v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Fetch the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unawatch-firmware
          path: out

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.firmware.outputs.version }}
        run: |
          set -euo pipefail
          repo=$GITHUB_REPOSITORY

          # The tag belongs to the mirror: never create or move it here. If
          # it has moved on since this run started, the run for its new
          # commit publishes instead.
          at=$(gh api "repos/$repo/commits/$TAG" --jq .sha 2>/dev/null) || at=
          if [ "$at" != "$GITHUB_SHA" ]; then
            echo "::notice::$TAG is at ${at:-nothing}, not $GITHUB_SHA: not publishing"
            exit 0
          fi

          if [ "$TAG" = unawatch-latest ]; then
            title="UNA Watch firmware (latest main)" flags=(--prerelease --latest=false)
          else
            title="UNA Watch firmware $TAG" flags=()
          fi

          # Replace the release of this tag, drafts included: GitHub turns a
          # release into a draft when the mirror briefly deletes its tag.
          gh api --paginate "repos/$repo/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$TAG\") | .id" |
            while read -r id; do
              gh api -X DELETE "repos/$repo/releases/$id"
              echo "deleted release $id"
            done

          cat > notes.md <<EOF
          Built from ${GITHUB_SHA} (${VERSION}).

          To install: turn the watch off, then hold the power button for 4 s as it turns on to reach the bootloader menu.
          Connect USB, copy the unapebble_unawatch_*.ota file, the only one needed, to the root of the drive that appears, eject it, unplug, and choose Continue.
          The bootloader installs it, the system resources included, deletes it from the drive and starts the firmware.
          Settings, apps and logs are kept from one install to the next.
          To go back, install UNA's own .ota the same way.

          unapebble_tether_*.ota is the tethered stub, a USB debug monitor installed the same way; the _host.tar.gz has tether.py and bridge.py to drive it. See docs/boards/unawatch/tether.md.

          Experimental: this firmware has not been tested on a watch.

          This repository is a read-only mirror of the development repository, which publishes the same build.
          EOF

          gh release create "$TAG" out/* --repo "$repo" --verify-tag \
            --title "$title" --notes-file notes.md "${flags[@]}"
          echo "Release: $GITHUB_SERVER_URL/$repo/releases/tag/$TAG"
