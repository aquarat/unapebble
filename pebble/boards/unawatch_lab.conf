# Firmware settings for the experiments firmware of the UNA Watch
# (unawatch/lab): it starts as the first port did, which boots, and carries
# the Lab app (docs/boards/unawatch).

# The charger a stand-in, nothing feeding it, as in the first port.
CONFIG_CHARGER_SIM=y

# The eMMC, which only the Lab app uses.
CONFIG_MMC=y

# The Lab app, shown at every boot, and the boot trace it reads.
CONFIG_APP_LAB=y
CONFIG_BOOT_TRACE=y
CONFIG_BOOT_TRACE_IMAGE="lab"
CONFIG_BOOT_TRACE_IMAGE_ID=1

# The first port's start: PLL1 runs as the bootloader left it until the
# clock tree starts. The Lab app shows the clocks and applies B's.
CONFIG_SOC_STM32U5_EARLY_PLL1_OFF=n
