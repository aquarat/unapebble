# Firmware settings for the unawatch board.

# The 240 x 240 round panel shows the centre of the 260 x 260 round
# framebuffer of the gabbro platform: apps built for the Pebble Round 2 run
# unchanged, and lose a 10 pixel ring at the edge (see unawatch.overlay).
CONFIG_PLATFORM_GABBRO=y

CONFIG_WATCHDOG=y

CONFIG_APP_SCALING=y
CONFIG_ORIENTATION_MANAGER=y

# Hardware without a driver yet gets the simulator's stand-in, which nothing
# feeds (unawatch.roles.yml): a die temperature. The watch has no ambient
# light sensor and no microphone. The BMI270 accelerometer, the BMM350
# magnetometer, with the compass service, and the MS5837 barometer have their
# drivers.
# Bluetooth runs on the fake controller (NIMBLE_HCI_FAKE), as on boards
# without a radio, until the BlueNRG-2 has a driver.
CONFIG_MAG=y
CONFIG_PRESSURE=y
CONFIG_ALS_SIM=y
CONFIG_AUDIO_SIM_MIC=y
CONFIG_TEMP_SIM=y

# The system resources installed with the image, in the embedded flash
# (pebbleos_resources.bin), and read in place. The firmware reads them from the
# system-resources partition after the code (RESOURCES_IN_CODE_FLASH, from
# unawatch.overlay), the experiments firmware from the second bank, where it
# keeps its storage too (unawatch_lab.overlay).
CONFIG_RESOURCES_IN_IMAGE=y
CONFIG_MMAP_RESOURCES=y

# The storage on the eMMC, the battery's fuel gauge (GAUGE) and the battery
# test app (BATTERY_TEST) are defaults of the board
# (boards/unawatch/Kconfig.defconfig, Kconfig), which the experiments
# firmware, unawatch/lab, does without.
