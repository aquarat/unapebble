# Firmware settings for the unawatch board.

# The 240 x 240 round panel shows the centre of the 260 x 260 round
# framebuffer of the gabbro platform: apps built for the Pebble Round 2 run
# unchanged, and lose a 10 pixel ring at the edge (see unawatch.overlay).
CONFIG_PLATFORM_GABBRO=y

CONFIG_WATCHDOG=y

# The system resources are read in place, in the second bank of the
# embedded flash.
CONFIG_MMAP_RESOURCES=y

CONFIG_APP_SCALING=y
CONFIG_ORIENTATION_MANAGER=y

# Hardware without a driver yet gets the simulator's stand-in, which nothing
# feeds (unawatch.roles.yml): the BMI270, the PCA9420 charger, a die
# temperature. The watch has no ambient light sensor and no microphone.
# Bluetooth runs on the fake controller (NIMBLE_HCI_FAKE), as on boards
# without a radio, until the BlueNRG-2 has a driver.
CONFIG_ACCEL_SIM=y
CONFIG_ALS_SIM=y
CONFIG_AUDIO_SIM_MIC=y
CONFIG_CHARGER_SIM=y
CONFIG_TEMP_SIM=y

# The bootloader installs one image from the code partition on: the
# resources go with it (pebbleos_resources.bin).
CONFIG_RESOURCES_IN_IMAGE=y
