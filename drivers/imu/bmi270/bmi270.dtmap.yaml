compatible: bosch,bmi270
config: ACCEL_BMI270
class: accel
define: PBL_BMI270_DEFINE
args:
  - parent: i2c
  - reg: 0
  - irq: 0
    field: irq
  - irq: 0
    as: irq-gpio
    field: irq_in
  - string: interrupt-names
    values:
      INT1: 1
      INT2: 2
    default: 1
    field: int_pin
  - strings: mount-matrix
    default: [1, 0, 0, 0, 1, 0, 0, 0, 1]
    wrap: PBL_MOUNT_MATRIX_MAP
    field: axis_map
  - strings: mount-matrix
    default: [1, 0, 0, 0, 1, 0, 0, 0, 1]
    wrap: PBL_MOUNT_MATRIX_DIR
    field: axis_dir
