compatible: bosch,bmm350
config: MAG_BMM350
class: mag
define: PBL_BMM350_DEFINE
args:
  - parent: i2c
  - reg: 0
  - strings: mount-matrix
    default: [1, 0, 0, 0, 1, 0, 0, 0, 1]
    wrap: PBL_MOUNT_MATRIX_MAP
    field: axis_map
  - strings: mount-matrix
    default: [1, 0, 0, 0, 1, 0, 0, 0, 1]
    wrap: PBL_MOUNT_MATRIX_DIR
    field: axis_dir
