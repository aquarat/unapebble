# The reset registers of the STM32H7 and STM32U5 RCC, the same but for their offsets, which the
# IDs carry
compatible:
  - st,stm32h743-rcc
  - st,stm32u5-rcc
config: RESET_STM32H7
class: reset
symbol: pbl_reset_stm32h7_rcc
define: PBL_RESET_STM32H7_DEFINE
args:
  - name: true
  - reg: 0
