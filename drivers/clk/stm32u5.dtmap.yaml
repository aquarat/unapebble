compatible: st,stm32u5-rcc
config: CLK_STM32U5
class: clk
symbol: pbl_clk_stm32u5
define: PBL_CLK_STM32U5_DEFINE
args:
  - name: true
  - reg: 0
  - reg: 0
    of: st,syscfg
  - string: st,supply-config
    of: st,syscfg
    default: PBL_CLK_STM32U5_SUPPLY_LDO
    values:
      ldo: PBL_CLK_STM32U5_SUPPLY_LDO
      smps: PBL_CLK_STM32U5_SUPPLY_SMPS
  - clock: hse
  - clock: lse
  - flag: st,lse-bypass
  - assigned-clocks: PBL_CLK_ASSIGNED
    optional: true
