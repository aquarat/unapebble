compatible:
  - st,stm32f7-hsotg
  - st,stm32u5-hsotg
config: UDC_DWC2
class: udc
define: PBL_UDC_DWC2_DEFINE
args:
  - name: true
  - reg: 0
  - irq: 0
  - compatible: true
    values:
      st,stm32f7-hsotg: DWC2_STM32
      st,stm32u5-hsotg: DWC2_STM32 | DWC2_STM32U5_HSPHY
  - clock: otg
  - clock: main_clk
    of: phys
    default: "{}"
  - flag: phys
  # The internal high-speed PHY of the STM32U5: its reference, the core's reset, and the SYSCFG and
  # PWR blocks it is controlled and supplied from
  - clock: utmi
    default: "{}"
  - reset: 0
    default: "{}"
  - reg: 0
    of: st,syscfg
    default: 0
  - clock: 0
    of: st,syscfg
    default: "{}"
  - reg: 0
    of: st,pwr
    default: 0
  - supply: usb33d
    default: nullptr
  - pinctrl: default
  - prop: g-rx-fifo-size
    default: 256
  - prop: g-np-tx-fifo-size
    default: 32
  - prop: g-tx-fifo-size
    item: "{0}"
