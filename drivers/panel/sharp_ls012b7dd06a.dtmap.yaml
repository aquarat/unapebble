compatible: sharp,ls012b7dd06a
config: PANEL_JDI_MIP
class: panel
define: PBL_PANEL_JDI_MIP_DEFINE
header: pbl/drivers/panel/jdi_mip.h
provides:
  round-mask: pbl_panel_ls012b7dd06a_round_mask
args:
  - name: true
  - supply: vddp
  - supply: vlcd
  - prop: clock-frequency
    child: panel-timing
  - prop: hactive
    child: panel-timing
  - prop: hback-porch
    child: panel-timing
  - prop: hfront-porch
    child: panel-timing
  - prop: vactive
    child: panel-timing
  - prop: vback-porch
    child: panel-timing
  - prop: vfront-porch
    child: panel-timing
  - prop: jdi,enable-start
  - prop: jdi,enable-end
  - pwm: 0
  - pwm: 1
    optional: true
